<!DOCTYPE html>
<html lang="en">
<head>

<title>Gate Doctor NWA</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f7;color:#333}

<div class="hero">
<h1>Gate Doctor</h1>

</div>
<div class="container">
<div class="card">
<h2>Residential Gate Repair</h2>
<p>Serving Northwest Arkansas. Sagging gates, dragging gates, broken hinges, latches, reinforcement and rebuilds.</p>
</div>
<div class="card">
<h2>Sample Project Photos</h2>
<div class="gallery">
<img src="gate1.png" alt="Gate repair photo">
<img src="gate2.png" alt="Gate repair photo">
</div>
</div>
</div>
